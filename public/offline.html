<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – CV. Indo Green Nature</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #374151;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #166534; }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #166534; color: white; border: none;
      padding: 0.75rem 2rem; border-radius: 9999px;
      font-size: 1rem; cursor: pointer; font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #14532d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌿</div>
    <h1>Sedang Offline</h1>
    <p>Tidak ada koneksi internet. Periksa jaringan Anda lalu coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
